name: Verify Bubbles templates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical WidgetPhi manifests, source references and forms
        run: node --test
      - name: Read-only export smoke test
        run: node scripts/template-cli.mjs manifest media-star > /dev/null
